<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAW BEAN · 问卷数据管理中心</title>
<meta name="description" content="RAW BEAN 咖啡问卷数据管理平台 - 数据分析、导出、维护">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;
  --purple:#8b5cf6;--cyan:#06b6d4;--bg:#f8fafc;--card:#fff;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6}
::selection{background:var(--blue);color:#fff}

/* ===== NAV ===== */
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.nav-i{max-width:1400px;margin:0 auto;display:flex;align-items:center;height:56px;gap:24px}
.nav-logo{font-weight:800;font-size:18px;color:var(--blue);text-decoration:none;letter-spacing:-0.5px}
.nav-links{display:flex;gap:4px}
.nav-links button{padding:8px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px;transition:all .15s}
.nav-links button:hover,.nav-links button.on{background:#eff6ff;color:var(--blue);font-weight:600}
.nav-actions{margin-left:auto;display:flex;gap:8px}
.nav-actions .btn{padding:8px 16px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid var(--border);transition:all .15s}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p:hover{opacity:.9}
.btn-s{background:var(--card);color:var(--muted)}
.btn-s:hover{border-color:#94a3b8;color:var(--text)}
.btn-d{background:var(--card);color:var(--red);border-color:var(--red)}
.btn-d:hover{background:var(--red);color:#fff}

/* ===== CONTAINER ===== */
.main{max-width:1400px;margin:0 auto;padding:24px}

/* ===== STATS GRID ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{padding:20px;background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .sv{font-size:clamp(24px,4vw,36px);font-weight:800}
.stat .sl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat .sch{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px}

/* ===== PANELS ===== */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:20px}
.panel h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel h3 .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ===== CHARTS ===== */
.chart-row{display:flex;flex-direction:column;gap:12px}
.chart-bar-row{display:flex;align-items:center;gap:10px;font-size:13px}
.chart-bar-label{min-width:70px;text-align:right;color:var(--muted);font-size:12px}
.chart-bar-track{flex:1;height:24px;background:#f1f5f9;border-radius:6px;overflow:hidden;position:relative}
.chart-bar-fill{height:100%;border-radius:6px;transition:width .6s ease-out;display:flex;align-items:center;padding:0 10px}
.chart-bar-fill span{font-size:10px;font-weight:700;white-space:nowrap;color:#fff}

/* Donut-like summary */
.donut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.donut-item{text-align:center;padding:12px 8px;border-radius:8px;background:#f8fafc;border:1px solid var(--border)}
.donut-item .dn{font-size:20px;font-weight:800}
.donut-item .dl{font-size:11px;color:var(--muted);margin-top:2px}

/* ===== TABLE ===== */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--blue)}
.toolbar input{min-width:200px}
.tbl-wrapper{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.comment-cell{max-width:250px}
.tbl tr:hover{background:#f8fafc}
.tbl .actions{display:flex;gap:4px}
.tbl .actions button{padding:4px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:10px;background:var(--card);transition:all .15s}
.tbl .actions .edit-btn:hover{background:#eff6ff;border-color:var(--blue);color:var(--blue)}
.tbl .actions .del-btn:hover{background:#fef2f2;border-color:var(--red);color:var(--red)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .ie{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:18px;margin-bottom:8px}
.empty-state p{font-size:13px}

/* ===== PAGINATION ===== */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:16px}
.pagination button{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;transition:all .15s}
.pagination button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pagination button:hover:not(.on){border-color:var(--blue)}

/* ===== MODAL ===== */
.modal-o{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .2s}
.modal-o.on{opacity:1;visibility:visible}
.modal-b{background:var(--card);border-radius:12px;padding:24px;max-width:600px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-b h3{font-size:18px;margin-bottom:16px}
.modal-b label{display:block;font-size:12px;color:var(--muted);margin-top:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.modal-b input,.modal-b select,.modal-b textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card)}
.modal-b textarea{min-height:60px;resize:vertical}
.modal-b input:focus,.modal-b select:focus,.modal-b textarea:focus{outline:none;border-color:var(--blue)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.modal-save{background:var(--blue);color:#fff;border:none}
.modal-save:hover{opacity:.9}
.modal-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}

/* ===== IMPORT ===== */
.import-zone{border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;transition:all .2s;margin-bottom:16px}
.import-zone:hover,.import-zone.drag{border-color:var(--blue);background:#eff6ff}
.import-zone .iz{font-size:40px;margin-bottom:8px}
.import-zone p{color:var(--muted);font-size:13px}
.import-zone input[type=file]{display:none}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .nav-i{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}
  .nav-actions{margin-left:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{flex-direction:column}
  .toolbar input{min-width:0;width:100%}
}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-i">
    <a class="nav-logo" href="#">📊 RAW BEAN · 数据管理</a>
    <div class="nav-links">
      <button class="on" onclick="switchView('dashboard',this)">仪表盘</button>
      <button onclick="switchView('data',this)">原始数据</button>
      <button onclick="switchView('analyze',this)">深度分析</button>
      <button onclick="switchView('manage',this)">数据维护</button>
    </div>
    <div class="nav-actions">
      <button class="btn btn-s" onclick="handleImport()">📥 导入</button>
      <button class="btn btn-s" onclick="exportAll()">📤 导出CSV</button>
      <button class="btn btn-p" onclick="location.href='index.html'">☕ 回主页</button>
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="main" id="mainContent"></div>

<!-- EDIT MODAL -->
<div class="modal-o" id="editModal">
  <div class="modal-b" id="editModalBody"></div>
</div>

<script>
/* ===== DATA ===== */
const STORAGE_KEY='rbsurveys';
function getData(){return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}

/* ===== CURRENT VIEW ===== */
let currentView='dashboard';

function switchView(view,btn){
  currentView=view;
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  render();
}

function render(){
  const mc=document.getElementById('mainContent');
  if(currentView==='dashboard')renderDashboard(mc);
  else if(currentView==='data')renderData(mc);
  else if(currentView==='analyze')renderAnalyze(mc);
  else if(currentView==='manage')renderManage(mc);
}

/* ===== DASHBOARD ===== */
function renderDashboard(mc){
  const data=getData();const n=data.length;
  // Compute stats
  const freq={};data.forEach(s=>{freq[s.frequency]=(freq[s.frequency]||0)+1});
  const roast={};data.forEach(s=>{roast[s.roastPref]=(roast[s.roastPref]||0)+1});
  const brew={};data.forEach(s=>{brew[s.brewMethod]=(brew[s.brewMethod]||0)+1});
  const budget={};data.forEach(s=>{budget[s.budget]=(budget[s.budget]||0)+1});
  // Latest
  const latest=n>0?data[n-1]:null;
  const first=n>0?data[0]:null;
  const days=first&&latest?Math.max(1,Math.ceil((new Date(latest.timestamp)-new Date(first.timestamp))/(1000*60*60*24))):0;
  const avgDaily=(days>0?(n/days).toFixed(1):0);

  mc.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="sv" style="color:var(--blue)">${n}</div><div class="sl">总提交数</div><div class="sch" style="color:var(--green)">↑ 持续增长</div></div>
      <div class="stat"><div class="sv" style="color:var(--purple)">${Object.keys(freq).length}</div><div class="sl">饮用频率分类</div></div>
      <div class="stat"><div class="sv" style="color:var(--yellow)">${Object.keys(roast).length}</div><div class="sl">烘焙偏好类型</div></div>
      <div class="stat"><div class="sv" style="color:var(--cyan)">${Object.keys(brew).length}</div><div class="sl">冲泡方式种类</div></div>
      <div class="stat"><div class="sv" style="color:var(--green)">${avgDaily}</div><div class="sl">日均提交</div></div>
      <div class="stat"><div class="sv" style="color:var(--red)">${days}</div><div class="sl">数据跨度（天）</div></div>
    </div>
    <div class="panels">
      <div class="panel">
        <h3><span class="dot" style="background:var(--blue)"></span> 饮用频率分布</h3>
        ${barChart(freq,['#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe'])}
      </div>
      <div class="panel">
        <h3><span class="dot" style="background:var(--purple)"></span> 烘焙度偏好</h3>
        ${barChart(roast,['#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe'])}
      </div>
      <div class="panel">
        <h3><span class="dot" style="background:var(--cyan)"></span> 冲泡方式</h3>
        ${barChart(brew,['#06b6d4','#22d3ee','#67e8f9','#a5f3fc','#cffafe'])}
      </div>
      <div class="panel">
        <h3><span class="dot" style="background:var(--yellow)"></span> 月度预算</h3>
        ${barChart(budget,['#f59e0b','#fbbf24','#fcd34d','#fde68a'])}
      </div>
    </div>
    <div class="panel" style="margin-top:0">
      <h3>📋 最近提交</h3>
      ${n===0?'<div class="empty-state"><div class="ie">📭</div><h3>暂无数据</h3><p>问卷提交后将自动在这里显示</p></div>':
      `<div class="tbl-wrapper"><table class="tbl"><thead><tr>
        <th>#</th><th>时间</th><th>频率</th><th>烘焙度</th><th>冲泡</th><th>预算</th><th>产地/拼配</th><th>期望服务</th>
      </tr></thead><tbody>
      ${data.slice(-5).reverse().map((s,i)=>{
        const idx=n-5+i+1;
        return `<tr>
          <td>${idx}</td><td>${fmtDate(s.timestamp)}</td><td>${s.frequency||'-'}</td><td>${s.roastPref||'-'}</td>
          <td>${s.brewMethod||'-'}</td><td>${s.budget||'-'}</td><td>${s.typePref||'-'}</td>
          <td>${(s.wantService||[]).join(',')||'-'}</td>
        </tr>`;
      }).join('')}
      </tbody></table></div>`}
    </div>`;
}

/* ===== BAR CHART HELPER ===== */
function barChart(obj,colors){
  const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0)return'<div style="color:var(--muted);font-size:13px;padding:20px 0">暂无数据</div>';
  const max=entries[0][1];
  return`<div class="chart-row">${entries.map(([k,v],i)=>{
    const pct=Math.round(v/max*100);const c=colors[i%colors.length];
    return`<div class="chart-bar-row">
      <span class="chart-bar-label">${k}</span>
      <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${c}"><span>${v}</span></div></div>
    </div>`;
  }).join('')}</div>`;
}

/* ===== DATA TABLE ===== */
let dPage=1,dFilter='',dSort='timestamp',dSortDir=-1;
const RPP=20;

function renderData(mc){
  let data=getData();
  // Filter
  if(dFilter){
    const q=dFilter.toLowerCase();
    data=data.filter(s=>JSON.stringify(s).toLowerCase().includes(q));
  }
  // Sort
  data.sort((a,b)=>{
    let va=a[dSort],vb=b[dSort];
    if(!va)return -1;if(!vb)return 1;
    if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();
    if(va<vb)return -1*dSortDir;if(va>vb)return 1*dSortDir;return 0;
  });
  const total=data.length,pages=Math.ceil(total/RPP);
  if(dPage>pages)dPage=Math.max(1,pages);
  const page=data.slice((dPage-1)*RPP,dPage*RPP);

  mc.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="sv" style="color:var(--blue)">${total}</div><div class="sl">筛选结果</div></div>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input placeholder="🔍 搜索所有字段..." value="${dFilter}" oninput="dFilter=this.value;dPage=1;renderData(document.getElementById('mainContent'))">
        <select onchange="dSort=this.value;renderData(document.getElementById('mainContent'))">
          <option value="timestamp">排序：提交时间</option>
          <option value="frequency">排序：饮用频率</option>
          <option value="roastPref">排序：烘焙度</option>
          <option value="brewMethod">排序：冲泡方式</option>
          <option value="budget">排序：预算</option>
        </select>
        <button class="btn btn-s" onclick="dSortDir*=-1;renderData(document.getElementById('mainContent'))">${dSortDir===1?'↑ 升序':'↓ 降序'}</button>
        <button class="btn btn-d" onclick="if(confirm('确定清空所有问卷数据？此操作不可撤销！')){saveData([]);renderData(document.getElementById('mainContent'))}">🗑 清空全部</button>
      </div>
      ${total===0?'<div class="empty-state"><div class="ie">🔎</div><h3>无匹配数据</h3></div>':
      `<div class="tbl-wrapper"><table class="tbl"><thead><tr>
        <th>#</th><th>提交时间</th><th>频率</th><th>时段</th><th>烘焙度</th><th>风味</th><th>预算</th><th>冲泡</th><th>产地/拼配</th><th>期望服务</th><th>留言</th><th>操作</th>
      </tr></thead><tbody>
      ${page.map((s,i)=>{
        const idx=(dPage-1)*RPP+i+1;
        return `<tr>
          <td>${idx}</td><td>${fmtDate(s.timestamp)}</td><td>${s.frequency||'-'}</td><td>${(s.time||[]).join(',')||'-'}</td>
          <td>${s.roastPref||'-'}</td><td>${(s.flavorPref||[]).join(',')||'-'}</td><td>${s.budget||'-'}</td>
          <td>${s.brewMethod||'-'}</td><td>${s.typePref||'-'}</td><td>${(s.wantService||[]).join(',')||'-'}</td>
          <td class="comment-cell">${s.comment||'-'}</td>
          <td class="actions">
            <button class="edit-btn" onclick="editEntry(${getData().indexOf(s)})">✏️ 编辑</button>
            <button class="del-btn" onclick="deleteEntry(${getData().indexOf(s)})">🗑 删除</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody></table></div>
      ${pages>1?`<div class="pagination">${Array.from({length:pages},(_,i)=>i+1).map(p=>
        `<button class="${p===dPage?'on':''}" onclick="dPage=${p};renderData(document.getElementById('mainContent'))">${p}</button>`
      ).join('')}</div>`:''}`}
    </div>`;
}

/* ===== ANALYZE ===== */
function renderAnalyze(mc){
  const data=getData();
  // Cross-analysis
  const roastFlavor={};
  data.forEach(s=>{
    const r=s.roastPref||'未选';
    if(!roastFlavor[r])roastFlavor[r]={};
    (s.flavorPref||[]).forEach(f=>{roastFlavor[r][f]=(roastFlavor[r][f]||0)+1});
  });
  const budgetBrew={};
  data.forEach(s=>{
    const b=s.budget||'未选';
    if(!budgetBrew[b])budgetBrew[b]={};
    const m=s.brewMethod||'未选';
    budgetBrew[b][m]=(budgetBrew[b][m]||0)+1;
  });
  // Flavor word cloud
  const flavorCount={};
  data.forEach(s=>{(s.flavorPref||[]).forEach(f=>{flavorCount[f]=(flavorCount[f]||0)+1})});
  const flavorSorted=Object.entries(flavorCount).sort((a,b)=>b[1]-a[1]);

  mc.innerHTML=`
    <div class="panels">
      <div class="panel">
        <h3><span class="dot" style="background:var(--blue)"></span> 风味偏好云</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:12px 0">
          ${flavorSorted.map(([k,v])=>{
            const size=Math.max(12,Math.min(32,10+v*2.5));
            const hue=Math.round(200+v*8)%360;
            return`<span style="font-size:${size}px;color:hsl(${hue},60%,45%);font-weight:700">${k}<sup style="font-size:10px;color:#94a3b8">${v}</sup></span>`;
          }).join('')}
          ${flavorSorted.length===0?'<span style="color:var(--muted)">暂无数据</span>':''}
        </div>
      </div>
      <div class="panel">
        <h3><span class="dot" style="background:var(--purple)"></span> 期望服务</h3>
        ${(()=>{
          const svc={};data.forEach(s=>{(s.wantService||[]).forEach(sv=>{svc[sv]=(svc[sv]||0)+1})});
          return barChart(svc,['#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe']);
        })()}
      </div>
      <div class="panel" style="grid-column:1/-1">
        <h3><span class="dot" style="background:var(--green)"></span> 交叉分析：烘焙度 × 风味偏好</h3>
        <div class="tbl-wrapper"><table class="tbl"><thead><tr>
          <th>烘焙度 / 风味</th>
          ${Object.keys(flavorCount).map(f=>`<th>${f}</th>`).join('')}
        </tr></thead><tbody>
        ${Object.entries(roastFlavor).map(([r,flavors])=>`<tr>
          <td><strong>${r}</strong></td>
          ${Object.keys(flavorCount).map(f=>`<td>${flavors[f]||0}</td>`).join('')}
        </tr>`).join('')}
        </tbody></table></div>
      </div>
    </div>`;
}

/* ===== MANAGE ===== */
function renderManage(mc){
  const data=getData();const n=data.length;
  mc.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="sv" style="color:var(--blue)">${n}</div><div class="sl">总记录数</div></div>
    </div>
    <div class="panel">
      <h3>🛠 数据维护</h3>
      <div class="import-zone" id="importZone">
        <div class="iz">📂</div>
        <p>拖拽 CSV/JSON 文件到这里，或点击选择文件</p>
        <p style="font-size:11px;margin-top:4px">支持 .csv 和 .json 格式</p>
        <input type="file" id="importFile" accept=".csv,.json" onchange="handleFileImport(event)">
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-p" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
        <button class="btn btn-s" onclick="exportAll()">📤 导出全部为 CSV</button>
        <button class="btn btn-s" onclick="exportJSON()">📤 导出为 JSON</button>
        <button class="btn btn-d" onclick="if(confirm('确定清空所有数据？不可还原！')){saveData([]);renderManage(document.getElementById('mainContent'))}">🗑 清空所有</button>
      </div>
      <div style="margin-top:16px;padding:12px;background:#fefce8;border-radius:8px;font-size:12px;color:#854d0e">
        <strong>💡 使用说明：</strong><br>
        1. 此管理页面与主站问卷数据实时同步（共享浏览器 localStorage）<br>
        2. 可导出为 CSV 后在 Excel 中打开分析<br>
        3. 可导入之前导出的数据文件恢复数据<br>
        4. 数据仅在本地浏览器存储，清除浏览器数据会丢失，请定期导出备份！
      </div>
    </div>`;

  // Drag & drop
  const zone=document.getElementById('importZone');
  if(zone){
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('drag');
      const file=e.dataTransfer.files[0];
      if(file)processFile(file);
    });
  }
}

function closeEditModal(){document.getElementById('editModal').classList.remove('on')}
function saveEdit(oi){
  const data=getData();
  data[oi].frequency=document.getElementById('edFrequency').value;
  data[oi].roastPref=document.getElementById('edRoast').value;
  data[oi].brewMethod=document.getElementById('edBrew').value;
  data[oi].budget=document.getElementById('edBudget').value;
  data[oi].typePref=document.getElementById('edTypePref').value;
  data[oi].comment=document.getElementById('edComment').value;
  data[oi].editedAt=new Date().toISOString();

}

/* ===== DELETE ENTRY ===== */
function deleteEntry(idx){
  if(!confirm('确定删除这条记录？'))return;
  const data=getData();data.splice(idx,1);saveData(data);render();
}

/* ===== EXPORT ===== */
function exportAll(){exportCSV()}
function exportCSV(){
  const data=getData();
  if(data.length===0){alert('暂无数据可导出');return}
  const keys=['frequency','roastPref','brewMethod','budget','typePref','discovery','time','flavorPref','brandVal','wantService','comment','timestamp'];
  let csv='#,频率,烘焙度,冲泡,预算,产地/拼配,发现渠道,时段,风味偏好,品牌看重,期望服务,留言,时间\n';
  data.forEach((s,i)=>{
    csv+=(i+1)+','+keys.map(k=>{const v=s[k];return Array.isArray(v)?'"'+v.join('; ')+'"':'"'+(v||'')+'"'}).join(',')+'\n';
  });
  downloadFile(csv,'survey-results.csv','text/csv;charset=utf-8');
}
function exportJSON(){
  const data=getData();
  if(data.length===0){alert('暂无数据');return}
  downloadFile(JSON.stringify(data,null,2),'survey-results.json','application/json');
}
function downloadFile(content,filename,mime){
  const blob=new Blob(['\ufeff'+content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

/* ===== IMPORT ===== */
function handleImport(){document.getElementById('importFile')?.click()}
function handleFileImport(e){
  const file=e.target.files[0];
  if(file)processFile(file);
}
function processFile(file){
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const name=file.name.toLowerCase();
      if(name.endsWith('.json')){
        const arr=JSON.parse(ev.target.result);
        if(!Array.isArray(arr))throw new Error('JSON 文件格式不正确，应为数组');
        const data=getData();
        saveData([...data,...arr]);
        alert(`成功导入 ${arr.length} 条记录，共 ${getData().length} 条`);
      }else if(name.endsWith('.csv')){
        // Parse CSV
        const lines=ev.target.result.split('\n').filter(l=>l.trim());
        if(lines.length<2){alert('CSV 为空');return}
        const headers=lines[0].split(',');
        const newData=[];
        for(let i=1;i<lines.length;i++){
          const vals=parseCSVLine(lines[i]);
          const obj={};
          headers.forEach((h,j)=>{obj[h]=vals[j]||''});
          newData.push(obj);
        }
        const data=getData();
        saveData([...data,...newData]);
        alert(`成功导入 ${newData.length} 条记录`);
      }
    }catch(err){alert('导入失败：'+err.message)}
    render();
  };
  reader.readAsText(file);
}
function parseCSVLine(line){
  const result=[];let current='',inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQuotes=!inQuotes}
    else if(c===','&&!inQuotes){result.push(current.trim());current=''}
    else{current+=c}
  }
  result.push(current.trim());
  return result;
}

/* ===== UTILS ===== */
function fmtDate(ts){
  if(!ts)return'-';
  const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ===== KEYBOARD ===== */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditModal()});

/* ===== INIT ===== */
render();
